[package]
name = "stelarith-agent"
version = "0.1.0"
edition = "2021"
description = "星璃·集控本地代理：执行 OS 动作、按需启动 VNC 远程控制。仅监听 127.0.0.1。"

# 体量目标：release 单二进制约数 MB（对比 Electron 同类数十~上百 MB）。
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
chrono = "0.4"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
# 生产验签（Ed25519，与 Node 参考实现 ext/stelarith-agent-node/agent.mjs verifyEd25519 契约一致）：
# token = base64url(Ed25519_sign(action|ts))，由网站私钥签名（ext/stelarith-website-sync/sign-task.mjs）。
ed25519-dalek = { version = "2", features = ["pkcs8", "signature"] }
base64 = "0.22"
webrtc = "0.21.0"
rtc = "0.21.0"
rust_socketio = "0.6.0"
# WebRTC 桌面视频帧（Sample.data 为 bytes::Bytes）
bytes = "1"
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
# 被控端输入注入（仅 Windows）；与 webrtc 拉入的 winapi 同一份，显式声明以便直接引用
winapi = { version = "0.3", features = ["winuser"] }

