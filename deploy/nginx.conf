# CIMS 反向代理 + TLS 终止
# 证书放置：./certs/fullchain.pem  ./certs/privkey.pem
# 将 cims.example.edu 解析到本机；客户端连接用 client 端口

events {
    worker_connections 1024;
}

http {
    upstream cims_client {
        server cims:8000;
    }
    upstream cims_mgmt {
        server cims:8001;
    }
    upstream stelarith_ext {
        server ext-gateway:${EXT_GATEWAY_PORT};
    }

    # HTTP -> HTTPS 跳转
    server {
        listen 80;
        server_name cims.example.edu;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主站
    server {
        listen 443 ssl;
        server_name cims.example.edu;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 客户端连接端点（ClassIsland 连这个）
        location / {
            proxy_pass http://cims_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # gRPC 所需（若后续启用 bidi 实时命令）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 管理前端 / Management API
        location /mgmt/ {
            rewrite ^/mgmt/(.*)$ /$1 break;
            proxy_pass http://cims_mgmt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stelarith 集控扩展网关（协作/上报/VNC回执，自有服务）
        location /ext/ {
            rewrite ^/ext/(.*)$ /$1 break;
            proxy_pass http://stelarith_ext;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
