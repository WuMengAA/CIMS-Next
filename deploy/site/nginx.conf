# Stelarith 站点源站 Nginx：TLS 反代 + 动静分流。
# 过渡态：静态（/_app/immutable、/uploads）由源站加缓存头；目标态这些走 Vercel 边缘/R2 CDN。
# 证书：deploy/site/certs/{fullchain.pem,privkey.pem}（未放证书时 443 会起不来，可先只暴露 80）。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # 上传体上限（项目板/附件库大文件，与站点侧 200M 对齐）
    client_max_body_size 220m;

    # HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    upstream site { server site:8090; }

    server {
        listen 443 ssl;
        http2 on;
        server_name _; # TODO: 改成正式域名

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 安全头（源头一份，边缘可叠加）
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 构建产物：强缓存（文件名带 hash，内容不变）
        location /_app/immutable/ {
            proxy_pass http://site;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 用户上传：长缓存（过渡态源站直出；目标态换 R2/CDN 域）
        location /uploads/ {
            proxy_pass http://site;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        }

        # 其余全部动态：后台/写 API/SSR/WebSocket，不缓存
        location / {
            proxy_pass http://site;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;   # WebSocket（cloud-ws / 集控心跳）
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }

    # WebSocket 升级映射（Connection 头按是否有 Upgrade 动态取值）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
