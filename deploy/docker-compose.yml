# CIMS 校园多媒体集控 - 一键部署
# 用法见 README.md
#
# 准备：将 CIMS-backend 源码整目录放入 ./cims-src/（保持含 pyproject.toml / Dockerfile）

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: cims-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cims-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  cims:
    build:
      context: ./cims-src
      dockerfile: Dockerfile
    container_name: cims-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${CIMS_CLIENT_PORT}:${CIMS_CLIENT_PORT}"
      - "${CIMS_MANAGEMENT_PORT}:${CIMS_MANAGEMENT_PORT}"
      - "${CIMS_ADMIN_PORT}:${CIMS_ADMIN_PORT}"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cims-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - cims
    restart: unless-stopped

  ext-gateway:
    image: node:20-alpine
    container_name: stelarith-ext-gateway
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: ${EXT_GATEWAY_PORT:-8088}
      DATA_FILE: /data/ext.json
    volumes:
      - ./ext-gateway/server.mjs:/app/server.mjs:ro
      - extdata:/data
    ports:
      - "${EXT_GATEWAY_PORT:-8088}:${EXT_GATEWAY_PORT:-8088}"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  extdata:
