<script>
  /* 主题预置：在 CSS 应用前给 <html> 加/去 dark，避免亮暗切换闪烁。
     优先级：URL ?theme=dark|light > localStorage > 系统偏好。embed 时宿主总带 ?theme。 */
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      var t = p.get("theme");
      if (!t) t = localStorage.getItem("console-theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.classList.toggle("dark", t === "dark");
    } catch (e) {}
  })();
</script>

  资源引用必须带 ?v=<版本>。原因（2026-09-19 线上事故）：
    1) Cloudflare 对本域的 .js/.css 走默认边缘缓存（Cache-Control: max-age=14400），
       不带查询串的 URL 会被缓存 4 小时 —— 改了代码、重启了服务，用户端却仍是旧版；
       实测带任意查询串的请求为 cf-cache-status: MISS（每次都回源），故 query 是可靠的破缓存手段。
    2) 改动本目录下任何 console 资源后，必须同步递增下面的 v 值，
       并且**必须重启 StelarithServer**（adapter-node 的 sirv 会缓存文件 size，
       文件被替换后仍按旧长度发送，表现为 HTML/JS 被拦腰截断、面板只剩线框）。
-->
