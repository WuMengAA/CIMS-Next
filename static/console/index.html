    1) Cloudflare 对本域的 .js/.css 走默认边缘缓存（Cache-Control: max-age=14400），
       不带查询串的 URL 会被缓存 4 小时 —— 改了代码、重启了服务，用户端却仍是旧版；
       实测带任意查询串的请求为 cf-cache-status: MISS（每次都回源），故 query 是可靠的破缓存手段。

       并且**必须重启 StelarithServer**（adapter-node 的 sirv 会缓存文件 size，
       文件被替换后仍按旧长度发送，表现为 HTML/JS 被拦腰截断、面板只剩线框）。
-->
