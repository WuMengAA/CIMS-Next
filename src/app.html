<!doctype html>
<html lang="zh-CN" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<!-- 首屏防闪现(FOUC)：外部 layout.css 是独立下载的样式表，
		     在它加载完成前，浏览器若先画出 .reveal 元素会以 opacity:1 闪一帧
		     （即「刷新时内容短暂闪现在模糊背景之上」）。这里把隐藏初态写进
		     内联关键 CSS——它随 HTML 同步解析、无需额外下载，首帧即生效，
		     比外部样式表早，从而把闪现彻底掐掉。外部 .reveal/.revealed 与
		     下方 noscript 仍以更高优先级正常覆盖。 -->
		<style>
			.reveal { opacity: 0; transform: translateY(24px) scale(0.985); will-change: opacity, transform; }
		</style>
		<!-- 无 JS 兜底：.reveal 首屏是 opacity:0，靠 JS 在 hydration 后解锁。
		     禁用脚本 / 脚本加载失败时若不放行，整站会呈现为空白页——
		     这是访客最容易误判成「网站挂了」的场景。 -->
		<noscript>
			<style>
				.reveal { opacity: 1 !important; transform: none !important; }
				#reading-progress, .nav-bar { display: none !important; }
			</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
